<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Holiday - CollegeConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .form-navigation {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .dashboard-back,
        .section-back {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .dashboard-back {
            background: #0f766e;
            color: white;
        }

        .section-back {
            background: #e5e7eb;
            color: #374151;
        }

        .dashboard-back:hover,
        .section-back:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<header>
    <h1>🏖️ Add College Holiday</h1>
    <p>Add a new holiday</p>
</header>

<main>

    <div class="form-navigation">

        <a href="/admin" class="dashboard-back">
            ← Back to Faculty Dashboard
        </a>

        <a href="/holidays" class="section-back">
            View Holidays
        </a>

    </div>

    <div class="form-box">

        <h2>Create Holiday</h2>

        <form method="POST">

            <label>Holiday Name</label>

            <input
                type="text"
                name="name"
                placeholder="Example: Independence Day"
                required
            >

            <label>Date</label>

            <input
                type="date"
                name="date"
                required
            >

            <label>Description</label>

            <textarea
                name="description"
                placeholder="Example: College will remain closed."
                required
            ></textarea>

            <button type="submit">
                Add Holiday
            </button>

        </form>

    </div>

</main>

</body>
</html>
